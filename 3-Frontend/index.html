<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valuation B3 - Análise Fundamentalista</title>
    <!-- Fonte Google Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Importação do CSS externo -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Cabeçalho -->
        <header>
            <h1>📈 Valuation B3 <span id="tituloMetodologia">| Benjamin Graham</span></h1>
        </header>

        <!-- Seletor de Metodologia -->
        <div class="controls">
            <select id="metodologiaSelector" class="search-box" onchange="mudarMetodologia(this.value)">
                <option value="graham">Benjamin Graham (Preço Justo)</option>
                <option value="bazin">Décio Bazin (Preço Teto / Dividendos)</option>
                <option value="magic">Magic Formula (Ranking Greenblatt)</option>
                <option value="gordon">Modelo de Gordon (Fluxo de Dividendos)</option>
            </select>
        </div>

        <!-- Controles de Pesquisa e Filtro IBOV -->
        <div class="controls">
            <input type="text" id="searchInput" class="search-box" placeholder="Pesquisar por Ticker ou Nome da Empresa..." onkeyup="filtrarAcoes()">
            <button id="btnIbov" class="btn-ibov" onclick="toggleFiltroIbov()">Apenas IBOV (Alta Liquidez)</button>
        </div>

        <!-- Tabela -->
        <div class="table-container">
            <table>
                <thead>
                    <tr id="tableHeaders">
                        <th>Ticker</th>
                        <th>Empresa</th>
                        <th>Preço Atual</th>
                        <th>Preço Justo</th>
                        <th>Margem de Segurança</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="tabela-acoes">
                    <tr>
                        <td colspan="6" class="loading">Carregando dados da bolsa... Por favor, aguarde.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Importação do arquivo JavaScript externo -->
    <script src="script.js"></script>

</body>
</html>
